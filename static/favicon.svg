<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="spotforge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#a855f7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="64" height="64" rx="16" fill="url(#spotforge-grad)"/>

  <!-- Subtle inner border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Studio Microphone Icon with Broadcast Waves -->
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Microphone capsule -->
    <rect x="25" y="14" width="14" height="22" rx="7" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="3"/>
    <!-- Sound grill line -->
    <line x1="28" y1="23" x2="36" y2="23" stroke="#ffffff" stroke-width="2"/>
    <!-- U-shaped pickup stand -->
    <path d="M19 28c0 7.18 5.82 13 13 13s13-5.82 13-13"/>
    <!-- Stem & Base -->
    <line x1="32" y1="41" x2="32" y2="49"/>
    <line x1="24" y1="49" x2="40" y2="49"/>
  </g>
</svg>
