services:
  - type: web
    name: spotforge
    env: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GEMMA_MODEL_ID
        value: gemma-4-26b-a4b-it
      - key: DEFAULT_VOICE_ID
        value: CwhRBWXzGAHq8TQ4Fs17
      - key: DEFAULT_LANGUAGE
        value: es
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "5"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "300"
