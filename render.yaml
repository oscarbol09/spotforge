services:
  - type: web
    name: spotforge
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GEMMA_MODEL_ID
        value: gemma-4-26b-a4b-it
      - key: DEFAULT_VOICE_ID
        value: CwhRBWXzGAHq8TQ4Fs17
      - key: DEFAULT_LANGUAGE
        value: es
